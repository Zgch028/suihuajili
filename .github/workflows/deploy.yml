name: Deploy to Cloudflare Pages

# 触发：推送到 main 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限原则（wrangler-action 需要创建 GitHub Deployment 状态）
permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + Pagefind)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # 注意：cloudflare/pages-action 官方仓库已删除（404），改用 wrangler-action v4
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 部署已构建好的 dist 到 Pages 项目；--branch=main 确保进入生产环境
          command: pages deploy dist --project-name=suihuajili --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
