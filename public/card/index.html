<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵国成 · 数字名片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
    background: #ece4d4;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative;
    width: 1000px; height: 1250px;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(130% 90% at 82% -12%, rgba(176,136,56,.10), transparent 55%),
      radial-gradient(90% 70% at 12% 110%, rgba(58,90,85,.10), transparent 60%),
      linear-gradient(158deg, #faf6ed 0%, #f4ecdc 58%, #ece2cf 100%);
    border: 1px solid rgba(168,127,51,.40);
    box-shadow: 0 30px 80px rgba(80,64,40,.22);
    color: #2b2620;
  }
  /* 淡墨山影 */
  .hills {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 380px; opacity: .5; pointer-events: none;
  }
  /* 淡墨晕染月 */
  .moon {
    position: absolute; top: 110px; right: 120px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle at 60% 40%, rgba(255,255,255,.55), rgba(176,136,56,.06) 70%, transparent 72%);
    filter: blur(2px); pointer-events: none;
  }
  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px;
    padding: 54px 60px 0;
  }
  .brand {
    font-size: 26px; letter-spacing: 6px; color: #9c7530; font-weight: 700;
  }
  .brand small { display:block; font-size: 15px; letter-spacing: 3px; color:#8a7d6a; font-weight:400; margin-top:6px; }
  .spacer { flex: 1; }
  .seal {
    width: 92px; height: 92px; border-radius: 14px;
    background: #b5341f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'KaiTi','楷体',serif; font-size: 52px; color: #fff;
    box-shadow: 0 6px 18px rgba(181,52,31,.30);
    border: 2px solid rgba(255,255,255,.25);
  }
  .identity {
    position: relative; z-index: 2;
    padding: 40px 60px 0;
    display: flex; align-items: center; gap: 36px;
  }
  .avatar {
    width: 168px; height: 168px; border-radius: 50%;
    object-fit: cover; border: 4px solid #b08838;
    box-shadow: 0 10px 30px rgba(80,64,40,.22);
    background: #f3ecdc;
  }
  .namebox .name {
    font-family: 'KaiTi','STKaiti','楷体',serif;
    font-size: 92px; font-weight: 700; letter-spacing: 8px; line-height: 1;
    color: #23201c;
    text-shadow: 0 2px 8px rgba(255,255,255,.6);
  }
  .namebox .pinyin {
    font-size: 24px; letter-spacing: 6px; color: #a87f33; margin-top: 14px;
    text-transform: uppercase;
  }
  .role {
    position: relative; z-index: 2;
    margin: 30px 60px 0;
    padding: 22px 26px;
    background: rgba(176,136,56,.08);
    border-left: 4px solid #b08838;
    border-radius: 10px;
  }
  .role .company { font-size: 30px; font-weight: 700; color: #2b2620; letter-spacing: 1px; }
  .role .title { font-size: 26px; color: #9c7530; margin-top: 8px; letter-spacing: 2px; }
  .creds {
    position: relative; z-index: 2;
    margin: 32px 60px 0;
    display: flex; flex-wrap: wrap; gap: 16px;
  }
  .chip {
    font-size: 23px; color: #3a332a;
    padding: 11px 22px; border-radius: 999px;
    border: 1px solid rgba(168,127,51,.45);
    background: rgba(176,136,56,.07);
    letter-spacing: 1px;
  }
  .foot {
    position: absolute; left: 60px; right: 60px; bottom: 56px; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .sitebox .label { font-size: 20px; color: #8a7d6a; letter-spacing: 2px; }
  .sitebox .url {
    font-size: 38px; font-weight: 800; color: #23201c; letter-spacing: 2px;
    margin-top: 8px;
  }
  .sitebox .url span { color: #a87f33; }
  .sitebox .tip { font-size: 18px; color:#8a7d6a; margin-top: 8px; letter-spacing:1px;}
  .qr {
    width: 178px; height: 178px; border-radius: 14px; background:#fff;
    padding: 12px; box-shadow: 0 10px 26px rgba(80,64,40,.18);
    border: 1px solid rgba(168,127,51,.30);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="moon"></div>
    <svg class="hills" viewBox="0 0 1000 380" preserveAspectRatio="none">
      <path d="M0,380 L0,220 C120,160 200,240 320,190 C440,140 520,260 660,200 C780,150 880,240 1000,180 L1000,380 Z" fill="#cdd8d0" opacity="0.55"/>
      <path d="M0,380 L0,280 C140,230 240,310 380,260 C520,210 600,310 740,265 C860,225 940,300 1000,260 L1000,380 Z" fill="#b9c7bd" opacity="0.6"/>
      <path d="M0,380 L0,330 C160,295 300,345 460,310 C620,275 720,345 880,315 C940,305 980,335 1000,325 L1000,380 Z" fill="#a9b9ad" opacity="0.7"/>
    </svg>

    <div class="topbar">
      <div class="brand">岁华纪丽<small>SHUIHUA JILI · 数字名片</small></div>
      <div class="spacer"></div>
      <div class="seal">赵</div>
    </div>

    <div class="identity">
      <img class="avatar" src="avatar.jpg" alt="赵国成">
      <div class="namebox">
        <div class="name">赵国成</div>
        <div class="pinyin">Zhao Guocheng</div>
      </div>
    </div>

    <div class="role">
      <div class="company">山西安宇建设监理有限公司</div>
      <div class="title">副总经理</div>
    </div>

    <div class="creds">
      <div class="chip">国家监理工程师</div>
      <div class="chip">古建监理师</div>
      <div class="chip">一级建造师</div>
      <div class="chip">咨询工程师</div>
      <div class="chip">钻石监理 IP 创始人</div>
    </div>

    <div class="foot">
      <div class="sitebox">
        <div class="label">个人网站 / WEBSITE</div>
        <div class="url">suihua<span>jili.cn</span></div>
        <div class="tip">扫码访问 · 历史照亮现代生活</div>
      </div>
      <img class="qr" src="qr.png" alt="网站二维码">
    </div>
  </div>
</body>
</html>
