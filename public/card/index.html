<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵国成 · 数字名片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face { font-family: 'LocalYaHei'; src: local('Microsoft YaHei'); }
  body {
    width: 1080px; height: 1350px;
    font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
    background: #0c2330;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative;
    width: 1000px; height: 1250px;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 80% -10%, rgba(201,161,74,.18), transparent 60%),
      linear-gradient(160deg, #0e2f3c 0%, #0c2433 55%, #0a1b27 100%);
    border: 1.5px solid rgba(201,161,74,.45);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    color: #f3ece0;
  }
  /* 底部千里江山意象山峦 */
  .hills {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 360px; opacity: .55; pointer-events: none;
  }
  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px;
    padding: 54px 60px 0;
  }
  .brand {
    font-size: 26px; letter-spacing: 6px; color: #d8b964; font-weight: 700;
  }
  .brand small { display:block; font-size: 15px; letter-spacing: 3px; color:#9fb6bd; font-weight:400; margin-top:6px; }
  .spacer { flex: 1; }
  .seal {
    width: 92px; height: 92px; border-radius: 14px;
    background: #b5341f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'KaiTi','楷体',serif; font-size: 52px; color: #fff;
    box-shadow: 0 6px 18px rgba(181,52,31,.5);
    border: 2px solid rgba(255,255,255,.25);
  }
  .identity {
    position: relative; z-index: 2;
    padding: 40px 60px 0;
    display: flex; align-items: center; gap: 36px;
  }
  .avatar {
    width: 168px; height: 168px; border-radius: 50%;
    object-fit: cover; border: 4px solid #c9a14a;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    background: #0c2433;
  }
  .namebox .name {
    font-family: 'KaiTi','STKaiti','楷体',serif;
    font-size: 92px; font-weight: 700; letter-spacing: 8px; line-height: 1;
    color: #fff;
    text-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .namebox .pinyin {
    font-size: 24px; letter-spacing: 6px; color: #c9a14a; margin-top: 14px;
    text-transform: uppercase;
  }
  .role {
    position: relative; z-index: 2;
    margin: 30px 60px 0;
    padding: 22px 26px;
    background: rgba(255,255,255,.06);
    border-left: 4px solid #c9a14a;
    border-radius: 10px;
  }
  .role .company { font-size: 30px; font-weight: 700; color: #f6efdf; letter-spacing: 1px; }
  .role .title { font-size: 26px; color: #d8b964; margin-top: 8px; letter-spacing: 2px; }
  .creds {
    position: relative; z-index: 2;
    margin: 32px 60px 0;
    display: flex; flex-wrap: wrap; gap: 16px;
  }
  .chip {
    font-size: 23px; color: #eae3d3;
    padding: 11px 22px; border-radius: 999px;
    border: 1px solid rgba(201,161,74,.5);
    background: rgba(201,161,74,.10);
    letter-spacing: 1px;
  }
  .foot {
    position: absolute; left: 60px; right: 60px; bottom: 56px; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .sitebox .label { font-size: 20px; color: #9fb6bd; letter-spacing: 2px; }
  .sitebox .url {
    font-size: 38px; font-weight: 800; color: #fff; letter-spacing: 2px;
    margin-top: 8px;
  }
  .sitebox .url span { color: #c9a14a; }
  .sitebox .tip { font-size: 18px; color:#9fb6bd; margin-top: 8px; letter-spacing:1px;}
  .qr {
    width: 178px; height: 178px; border-radius: 14px; background:#fff;
    padding: 12px; box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="hills" viewBox="0 0 1000 360" preserveAspectRatio="none">
      <path d="M0,360 L0,210 C120,150 200,230 320,180 C440,130 520,250 660,190 C780,140 880,230 1000,170 L1000,360 Z" fill="#11464f" opacity="0.9"/>
      <path d="M0,360 L0,270 C140,220 240,300 380,250 C520,200 600,300 740,255 C860,215 940,290 1000,250 L1000,360 Z" fill="#0d3742" opacity="0.95"/>
      <path d="M0,360 L0,320 C160,285 300,335 460,300 C620,265 720,335 880,305 C940,295 980,325 1000,315 L1000,360 Z" fill="#0a2330"/>
    </svg>

    <div class="topbar">
      <div class="brand">岁华纪丽<small>SHUIHUA JILI · 数字名片</small></div>
      <div class="spacer"></div>
      <div class="seal">赵</div>
    </div>

    <div class="identity">
      <img class="avatar" src="avatar.jpg" alt="赵国成">
      <div class="namebox">
        <div class="name">赵国成</div>
        <div class="pinyin">Zhao Guocheng</div>
      </div>
    </div>

    <div class="role">
      <div class="company">山西安宇建设监理有限公司</div>
      <div class="title">副总经理</div>
    </div>

    <div class="creds">
      <div class="chip">国家监理工程师</div>
      <div class="chip">古建监理师</div>
      <div class="chip">一级建造师</div>
      <div class="chip">咨询工程师</div>
      <div class="chip">钻石监理 IP 创始人</div>
    </div>

    <div class="foot">
      <div class="sitebox">
        <div class="label">个人网站 / WEBSITE</div>
        <div class="url">suihua<span>jili.cn</span></div>
        <div class="tip">扫码访问 · 历史照亮现代生活</div>
      </div>
      <img class="qr" src="qr.png" alt="网站二维码">
    </div>
  </div>
</body>
</html>
