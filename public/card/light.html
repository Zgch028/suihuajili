<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵国成 · 数字名片（浅色水墨版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px;
    font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
    background: #d8d0c4;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative;
    width: 1000px; height: 1250px;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 78% -10%, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(80% 60% at 10% 108%, rgba(60,52,42,.06), transparent 58%),
      linear-gradient(170deg, #f5efe1 0%, #ece4d0 55%, #ddd2b8 100%);
    border: 1px solid rgba(120,100,70,.20);
    box-shadow: 0 30px 80px rgba(60,52,42,.22);
    color: #2a241c;
  }
  /* 三层淡墨山影 —— 水墨淡彩风格 */
  .hills {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 360px; pointer-events: none;
  }
  .moon {
    position: absolute; top: 110px; right: 110px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at 60% 40%, rgba(154,123,46,.18), rgba(154,123,46,.04) 70%, transparent 72%);
    filter: blur(1.5px); pointer-events: none;
  }
  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px;
    padding: 54px 60px 0;
  }
  .brand {
    font-size: 26px; letter-spacing: 6px; color: #9a7b2e; font-weight: 700;
  }
  .brand small { display:block; font-size: 15px; letter-spacing: 3px; color:#7a6c4f; font-weight:400; margin-top:6px; }
  .spacer { flex: 1; }
  .seal {
    width: 88px; height: 88px; border-radius: 14px;
    background: #b5341f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'KaiTi','楷体',serif; font-size: 50px; color: #fff;
    box-shadow: 0 6px 18px rgba(120,40,30,.30);
    border: 2px solid rgba(255,255,255,.30);
  }
  .identity {
    position: relative; z-index: 2;
    padding: 40px 60px 0;
    display: flex; align-items: center; gap: 36px;
  }
  .avatar {
    width: 168px; height: 168px; border-radius: 50%;
    object-fit: cover; border: 4px solid #9a7b2e;
    box-shadow: 0 10px 30px rgba(60,52,42,.22);
    background: #f3ecdc;
  }
  .namebox .name {
    font-family: 'KaiTi','STKaiti','楷体',serif;
    font-size: 92px; font-weight: 700; letter-spacing: 8px; line-height: 1;
    color: #2a241c;
  }
  .namebox .pinyin {
    font-size: 24px; letter-spacing: 6px; color: #9a7b2e; margin-top: 14px;
    text-transform: uppercase;
  }
  .role {
    position: relative; z-index: 2;
    margin: 30px 60px 0;
    padding: 22px 26px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(120,100,70,.20);
    border-left: 4px solid #9a7b2e;
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }
  .role .company { font-size: 30px; font-weight: 700; color: #2a241c; letter-spacing: 1px; }
  .role .title { font-size: 26px; color: #9a7b2e; margin-top: 8px; letter-spacing: 2px; }
  .contact {
    position: relative; z-index: 2;
    margin: 26px 60px 0;
    display: flex; gap: 22px;
    flex-wrap: wrap;
  }
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; color: #2a241c;
    background: rgba(255,255,255,.65);
    border: 1px solid rgba(120,100,70,.22);
    border-radius: 999px;
    padding: 10px 22px;
  }
  .contact-item .icon {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #9a7b2e;
  }
  .creds {
    position: relative; z-index: 2;
    margin: 28px 60px 0;
    display: flex; flex-wrap: wrap; gap: 14px;
  }
  .chip {
    font-size: 22px; color: #2a241c;
    padding: 10px 20px; border-radius: 999px;
    border: 1px solid rgba(120,100,70,.30);
    background: rgba(255,255,255,.55);
    letter-spacing: 1px;
  }
  .foot {
    position: absolute; left: 60px; right: 60px; bottom: 56px; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .sitebox .label { font-size: 20px; color: #7a6c4f; letter-spacing: 2px; }
  .sitebox .url {
    font-size: 38px; font-weight: 800; color: #2a241c; letter-spacing: 2px;
    margin-top: 8px;
  }
  .sitebox .url span { color: #9a7b2e; }
  .sitebox .tip { font-size: 18px; color:#7a6c4f; margin-top: 8px; letter-spacing:1px;}
  .qr {
    width: 178px; height: 178px; border-radius: 14px; background:#fff;
    padding: 12px; box-shadow: 0 10px 26px rgba(60,52,42,.20);
    border: 1px solid rgba(120,100,70,.25);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="moon"></div>
    <svg class="hills" viewBox="0 0 1000 360" preserveAspectRatio="none">
      <path d="M0,360 L0,200 C120,140 200,220 320,170 C440,120 520,240 660,180 C780,130 880,220 1000,160 L1000,360 Z" fill="#a89c80" opacity="0.30"/>
      <path d="M0,360 L0,260 C140,210 240,290 380,240 C520,190 600,290 740,245 C860,205 940,280 1000,240 L1000,360 Z" fill="#85775c" opacity="0.38"/>
      <path d="M0,360 L0,310 C160,275 300,325 460,290 C620,255 720,325 880,295 C940,285 980,315 1000,305 L1000,360 Z" fill="#5e513e" opacity="0.50"/>
    </svg>

    <div class="topbar">
      <div class="brand">岁华纪丽<small>SHUIHUA JILI · 数字名片</small></div>
      <div class="spacer"></div>
      <div class="seal">赵</div>
    </div>

    <div class="identity">
      <img class="avatar" src="avatar.jpg" alt="赵国成">
      <div class="namebox">
        <div class="name">赵国成</div>
        <div class="pinyin">Zhao Guocheng</div>
      </div>
    </div>

    <div class="role">
      <div class="company">山西安宇建设监理有限公司</div>
      <div class="title">副总经理</div>
    </div>

    <div class="contact">
      <div class="contact-item">
        <div class="icon">☎</div>
        <div>13546339366</div>
      </div>
      <div class="contact-item">
        <div class="icon">◎</div>
        <div>山西 · 太原</div>
      </div>
    </div>

    <div class="creds">
      <div class="chip">国家监理工程师</div>
      <div class="chip">古建监理师</div>
      <div class="chip">一级建造师</div>
      <div class="chip">咨询工程师</div>
      <div class="chip">钻石监理 IP 创始人</div>
    </div>

    <div class="foot">
      <div class="sitebox">
        <div class="label">个人网站 / WEBSITE</div>
        <div class="url">suihua<span>jili.cn</span></div>
        <div class="tip">扫码访问 · 历史照亮现代生活</div>
      </div>
      <img class="qr" src="qr.png" alt="网站二维码">
    </div>
  </div>
</body>
</html>
