.rail-node{position:relative;flex:0 0 auto;width:76px;height:55px;border:0;background:none;cursor:pointer;padding:0;color:var(--muted);font-family:inherit}
.rail-node:after{content:"";position:absolute;left:0;right:0;top:17px;height:2px;background:#ded3bf;z-index:0}

  .toast{bottom:190px}

/* ========== 二、坐标转换 WGS84 → GCJ-02 ========== */
function outOfChina(lng,lat){return lng<73.66||lng>135.05||lat<3.86||lat>53.55}
function tLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function tLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function wgs2gcj(lng,lat){
  if(outOfChina(lng,lat))return [lng,lat];
  const a=6378245,ee=.00669342162296594323;
  let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI,magic=1-ee*Math.sin(rad)*Math.sin(rad),sq=Math.sqrt(magic);
  dLat=dLat*180/((a*(1-ee))/(magic*sq)*Math.PI);
  dLng=dLng*180/(a/sq*Math.cos(rad)*Math.PI);
  return [lng+dLng,lat+dLat];
}

/* ========== 四、地图与交互 ========== */
let map=null,markerLayer=null,lineLayer=null,memMarkerLayer=null;
let currentId=null,currentRoute=null,actFilter=0,drawerTab='node',revealed=0,autoTimer=null;
const layers={nodes:true,routes:true,memorials:true};
const $=s=>document.querySelector(s);
const toast=msg=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)};
function actColor(a){return {1:'#c0392b',2:'#a8551c',3:'#2f6b4f',4:'#6b4b9a',5:'#42658a'}[a]}
function markerSvg(color,pending,num){
  const ring=pending?'<circle cx="13" cy="13" r="8" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>':'<circle cx="13" cy="13" r="7.5" fill="#fff" opacity=".92"/>';
  const txt=num?('<text x="13" y="17" font-size="10" font-weight="bold" text-anchor="middle" fill="'+color+'">'+num+'</text>'):'';
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="32" viewBox="0 0 26 32"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 19 13 19s13-9.5 13-19C26 5.8 20.2 0 13 0z" fill="'+color+'" stroke="#fff" stroke-width="1.6"/>'+ring+txt+'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
function buildStyles(){
  const styles={};
  NODES.forEach(n=>{
    styles['n'+n[0]]=new TMap.MarkerStyle({width:26,height:32,anchor:{x:13,y:32},src:markerSvg(actColor(n[1]),false,n[0])});
    styles['p'+n[0]]=new TMap.MarkerStyle({width:26,height:32,anchor:{x:13,y:32},src:markerSvg(actColor(n[1]),true,n[0])});
  });
  styles.mem=new TMap.MarkerStyle({width:18,height:18,anchor:{x:9,y:9},src:markerSvg('#b0873b',false)});
  return styles;
}
function initMap(){
  if(typeof TMap==='undefined'){fallbackMap();return}
  try{
    map=new TMap.Map('map',{zoom:5,center:new TMap.LatLng(32.2,106.5),showControl:false});
    // 关闭地图自带指北针/缩放/比例尺控件：它们固定在右上角，与页面操作栏重叠
    try{const D=TMap.constants.DEFAULT_CONTROL_ID;map.removeControl(D.ROTATION);map.removeControl(D.ZOOM);map.removeControl(D.SCALE)}catch(e){}
    const styles=buildStyles();
    markerLayer=new TMap.MultiMarker({map,styles,geometries:[]});
    lineLayer=new TMap.MultiPolyline({map,styles:{},geometries:[]});
    memMarkerLayer=new TMap.MultiMarker({map,styles:{mem:styles.mem},geometries:[]});
    markerLayer.on('click',e=>selectNode(Number(e.geometry.id)));
    lineLayer.on('click',e=>{const ri=Number(String(e.geometry.id).replace('route',''));if(!isNaN(ri))selectRoute(ri)});
    memMarkerLayer.on('click',e=>{toast('纪念馆线索：'+e.geometry.properties.name);openDrawer('memorial')});
    drawMap();
  }catch(err){fallbackMap();console.warn('地图初始化失败，已降级为离线视图',err)}
}
function fallbackMap(){$('#map').classList.add('hidden');$('#mapOffline').style.display='flex';$('#legend').style.display='none';$('.hud-prog').style.display='none'}
function drawMap(){
  if(!map)return;
  const shown=NODES.filter(n=>REVEAL_ORDER.indexOf(n[0])<revealed&&(actFilter===0||n[1]===actFilter));
  markerLayer.setGeometries(layers.nodes?shown.map(n=>{
    const p=PLACES[n[3]],c=wgs2gcj(p.c[0],p.c[1]);
    return {id:String(n[0]),styleId:(n[12]==='已核'?'n':'p')+n[0],position:new TMap.LatLng(c[1],c[0]),properties:{title:n[4]}};
  }):[]);
  const ls={},gs=[];
  ROUTES.forEach((r,ri)=>{
    const pts=shown.filter(n=>r.ids.indexOf(n[0])>=0).sort((a,b)=>r.ids.indexOf(a[0])-r.ids.indexOf(b[0])).map(n=>{const c=wgs2gcj(PLACES[n[3]].c[0],PLACES[n[3]].c[1]);return new TMap.LatLng(c[1],c[0])});
    if(pts.length<2)return;
    ls['r'+ri]=new TMap.PolylineStyle({color:r.color,width:currentRoute===ri?7:4,borderWidth:1,borderColor:'#ffffff',lineCap:'round'});
    gs.push({id:'route'+ri,styleId:'r'+ri,paths:pts});
  });
  lineLayer.setStyles(ls);lineLayer.setGeometries(layers.routes?gs:[]);
  memMarkerLayer.setGeometries(layers.memorials?Object.keys(PLACES).filter(k=>shown.some(n=>n[3]===k)).map(k=>{const p=PLACES[k],c=wgs2gcj(p.c[0],p.c[1]);return {id:'m_'+k,styleId:'mem',position:new TMap.LatLng(c[1],c[0]),properties:{name:p.h}}}):[]);
}
function setReveal(k){
  revealed=Math.max(0,Math.min(REVEAL_ORDER.length,k));
  $('#range').value=revealed;
  $('#progText').textContent='已展开 '+revealed+' / '+REVEAL_ORDER.length+' 节点';
  drawMap();renderRail();
}
function stopReveal(){if(autoTimer)clearInterval(autoTimer);autoTimer=null;$('#playBtn').textContent='▶ 展开路线'}
function startReveal(){
  stopReveal();
  if(revealed>=REVEAL_ORDER.length)setReveal(0);
  $('#playBtn').textContent='❚❚ 暂停';
  autoTimer=setInterval(()=>{
    if(revealed>=REVEAL_ORDER.length){stopReveal();toast('路线展开完成，点击节点或路线查看内容');return}
    setReveal(revealed+1);
  },330);
}
function renderRail(){
  $('#railBody').innerHTML=REVEAL_ORDER.map((id,i)=>{
    const n=NODES.find(x=>x[0]===id);
    return '<button class="rail-node'+(i<revealed?' on':'')+(currentId===id?' cur':'')+'" data-id="'+id+'" title="'+n[2]+' '+n[4]+'"><span class="rn-dot" style="background:'+(i<revealed?actColor(n[1]):'#d8cdb8')+'"></span><span class="rn-lb">'+n[4]+'</span></button>';
  }).join('');
  $('#railBody').querySelectorAll('.rail-node').forEach(b=>b.onclick=()=>selectNode(Number(b.dataset.id)));
}
function renderLegend(){
  $('#legend').innerHTML='<div class="lg-t">图例 · 点击彩色路线看部队</div>'+ROUTES.map(r=>'<div><span class="dot" style="background:'+r.color+'"></span>'+r.name+'</div>').join('')+'<div><span class="dot" style="background:#b0873b"></span>纪念馆线索</div><div class="small">虚线白圈＝待核节点</div>';
}
function srcLinks(n){const ids=Array.isArray(n[11])?n[11]:[];return ids.map(s=>'<span class="tag blue">'+s+'</span>').join('')}
function shareFor(n){return '?year='+encodeURIComponent(n[2].replace(/[^\d.—-]/g,'').slice(0,4))+'&place='+encodeURIComponent(PLACES[n[3]].h)}

function openDrawer(tab){
  drawerTab=tab||drawerTab;
  document.body.classList.add('d-open');
  document.querySelectorAll('.d-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===drawerTab));
  renderDrawer();
  if(map&&map.resize)setTimeout(()=>map.resize(),350);
}
function closeDrawer(){
  document.body.classList.remove('d-open');currentRoute=null;drawMap();
  if(map&&map.resize)setTimeout(()=>map.resize(),350);
}
function renderDrawer(){
  if(drawerTab==='node'){
    if(currentId)renderNode(NODES.find(n=>n[0]===currentId));
    else{$('#dTitle').textContent='节点详情';$('#dBody').innerHTML='<div class="empty">点击地图上的节点、彩色路线或底部时间轴，查看对应知识与依据。</div>'}
  }else if(drawerTab==='route')renderRoutePanel();
  else if(drawerTab==='place')renderPlacePanel();
  else if(drawerTab==='memorial')renderMemorialPanel();
  else if(drawerTab==='image')renderImagePanel();
  else if(drawerTab==='source')renderSourcePanel();
}
function renderNode(n){
  const p=PLACES[n[3]];
  const pend=n[12]!=='已核'?'<span class="tag warn">'+n[12]+' · 公开标注</span>':'<span class="tag ok">已核</span>';
  $('#dTitle').textContent=String(n[0]).padStart(2,'0')+' · '+n[4];
  $('#dBody').innerHTML='<div class="kv">'+
    '<span class="k">时间</span><span>'+n[2]+'</span>'+
    '<span class="k">古今地名</span><span>'+p.h+' → <strong>'+p.n+'</strong>（'+p.a+'）</span>'+
    '<span class="k">部队</span><span>'+n[7]+'</span>'+
    '<span class="k">人物</span><span>'+n[8]+'</span>'+
    '<span class="k">事件经过</span><span>'+n[5]+'</span>'+
    '<span class="k">历史意义</span><span>'+n[6]+'</span>'+
    '<span class="k">纪念馆</span><span>'+(n[10]||'—（暂无对应线索）')+'</span>'+
    '<span class="k">核验状态</span><span>'+pend+'</span></div>'+
    '<div class="src-line"><strong>依据来源：</strong>'+srcLinks(n)+'</div>'+
    '<div class="small" style="margin-top:6px">别名：'+n[9]+' · 深链接：<code>'+shareFor(n)+'</code></div>'+
    (imgsForNode(n[0]).length?imgsForNode(n[0]).map(renderImageCard).join(''):'<figure class="note-fig">'+fig(n[13],n[4])+'<figcaption>场景示意 · 程序绘制，非史料照片（本节点暂无可核验历史影像）</figcaption></figure>')+
    '<div class="hintrow"><button class="btn" data-jump="place">查看地名沿革 →</button><button class="btn" data-jump="memorial">查看纪念馆 →</button></div>';
  $('#dBody').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.jump));
}
function selectNode(id){
  const n=NODES.find(x=>x[0]===id);if(!n)return;
  currentId=id;currentRoute=null;stopReveal();
  const idx=REVEAL_ORDER.indexOf(id);if(idx>=revealed)setReveal(idx+1);
  renderDrawer();renderRail();drawMap();openDrawer('node');
  const p=PLACES[n[3]];
  if(map){const c=wgs2gcj(p.c[0],p.c[1]);map.easeTo({center:new TMap.LatLng(c[1],c[0]),zoom:Math.max(map.getZoom(),7)},{duration:500})}
  try{history.replaceState(null,'',shareFor(n))}catch(e){}
  const el=document.querySelector('.rail-node.cur');if(el)el.scrollIntoView({block:'nearest',inline:'center'});
}
function selectRoute(ri){
  const r=ROUTES[ri];if(!r)return;
  currentRoute=ri;currentId=null;stopReveal();
  const maxIdx=Math.max.apply(null,r.ids.map(id=>REVEAL_ORDER.indexOf(id)));
  if(maxIdx>=revealed)setReveal(maxIdx+1);
  drawMap();openDrawer('route');
  if(map){try{
    const pts=r.ids.map(id=>NODES.find(n=>n[0]===id)).filter(Boolean).map(n=>{const c=wgs2gcj(PLACES[n[3]].c[0],PLACES[n[3]].c[1]);return new TMap.LatLng(c[1],c[0])});
    const b=new TMap.LatLngBounds(pts[0],pts[0]);pts.forEach(p=>b.extend(p));map.fitBounds(b,{padding:70});
  }catch(e){}}
}
function renderRoutePanel(){
  $('#dTitle').textContent='五路红军 · 行进路线';
  if(currentRoute===null){
    $('#dBody').innerHTML='<div class="small" style="margin-bottom:10px">点击地图上任意彩色路线，或选择下面一条：</div>'+ROUTES.map((r,i)=>'<button class="route-card" data-ri="'+i+'"><span class="dot" style="background:'+r.color+'"></span><strong>'+r.name+'</strong><span class="small">'+r.ids.length+' 个节点</span></button>').join('')+'<div class="disc" style="margin-top:12px">路线为史料节点连线，<strong>非精确行军轨迹</strong>。并行线路线含与主力会师的衔接节点，点击各节点查看具体经过。</div>';
    $('#dBody').querySelectorAll('[data-ri]').forEach(b=>b.onclick=()=>selectRoute(Number(b.dataset.ri)));
    return;
  }
  const r=ROUTES[currentRoute];
  const list=r.ids.map(id=>NODES.find(n=>n[0]===id)).filter(Boolean);
  $('#dBody').innerHTML='<div class="route-head"><span class="dot" style="background:'+r.color+'"></span><strong>'+r.name+'</strong><button class="btn" id="backRoutes">← 全部路线</button></div>'+
    '<div class="small">收录 '+list.length+' 个关键节点，为史料节点连线示意。</div>'+
    '<div class="route-list">'+list.map(n=>'<button class="rl-item" data-id="'+n[0]+'"><span class="n-date">'+n[2]+'</span><strong>'+n[4]+'</strong><span class="small">'+PLACES[n[3]].h+'</span></button>').join('')+'</div>';
  $('#backRoutes').onclick=()=>{currentRoute=null;renderRoutePanel();drawMap()};
  $('#dBody').querySelectorAll('.rl-item').forEach(b=>b.onclick=()=>selectNode(Number(b.dataset.id)));
}
function renderPlacePanel(){
  $('#dTitle').textContent='古今地名对照 · 点地溯源';
  $('#dBody').innerHTML='<div class="small" style="margin-bottom:9px">历史地名 → 今地名 → 坐标 → 沿革。点击行定位到节点。</div><table class="mini"><thead><tr><th>历史地名</th><th>今地名 / 区划</th><th>沿革要点</th><th>核验</th></tr></thead><tbody>'+
    Object.keys(PLACES).map(k=>{const p=PLACES[k],nid=NODES.find(n=>n[3]===k);return '<tr data-id="'+(nid?nid[0]:'')+'"><td><strong>'+p.h+'</strong></td><td>'+p.n+'<br><span class="small">'+p.a+'</span></td><td class="small">'+p.e.join('；')+'</td><td><span class="tag '+(p.s==='已核'?'ok':'warn')+'">'+p.s+'</span></td></tr>'}).join('')+
    '</tbody></table>';
  $('#dBody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{if(tr.dataset.id)selectNode(Number(tr.dataset.id))});
}
function renderMemorialPanel(){
  $('#dTitle').textContent='纪念馆与旧址线索';
  $('#dBody').innerHTML='<div class="disc">线索来自馆方与文物资料，<strong>不取旅游平台 UGC 为史实</strong>；标"待核"者公开保留，待馆方核定。</div><table class="mini"><thead><tr><th>馆名 / 旧址</th><th>地址线索</th><th>状态</th></tr></thead><tbody>'+
    MEMORIALS.map(m=>'<tr><td><strong>'+m[0]+'</strong><br><span class="small">'+m[2]+'</span></td><td class="small">'+m[1]+'</td><td><span class="tag '+(m[3]==='已核'?'ok':'warn')+'">'+m[3]+'</span></td></tr>').join('')+'</tbody></table>';
}
function renderImagePanel(){
  $('#dTitle').textContent='历史影像 · 来源核验';
  $('#dBody').innerHTML=
    '<div class="disc"><strong>一个必须先说清的事实：</strong>长征沿途极少留下照片。现存标志性影像多为 1936 年长征结束后在陕北、宁夏拍摄的亲历者肖像与合影，部分经本人回忆确认为摆拍。<b>本页任何图片都不表述为"长征行军现场照片"</b>；每张均标明拍摄时间、地点、作者与授权判断。</div>'+
    '<h3 style="font-size:13px;color:#6b140d;margin:12px 0 6px">一、真实历史影像（来源可核验 · 授权状态逐张公开）</h3>'+
    IMAGES.map(renderImageCard).join('')+
    '<h3 style="font-size:13px;color:#6b140d;margin:14px 0 6px">二、国家图书馆"馆藏长征文献专题展"书影 · 逐图核验</h3>'+
    '<div class="card-s"><b>核验结论：</b>该展览是中国国家图书馆 <b>2026 年策展产物</b>，展览网页上的图片是<b>为展览制作的书影 /  digitized 图像</b>，<strong>展览页面图片 ≠ 馆藏原件公版</strong>——文献原件年代久远不等于其数字化图像自动进入公有领域，拍摄与数字化者可能享有权利。因此本页<b>不嵌入展览页面书影</b>，仅提供书目信息与官方入口，待逐图向馆方确认授权后再上。</div>'+
    '<div class="card-s"><b>可安全引用的书目信息</b>（书目名称、馆藏单位、展览名称属事实信息，不受著作权保护）：<br>· 展览名称：国家图书馆"馆藏长征文献专题展"<br>· 主办：中国国家图书馆<br>· 展期：2026 年（长征胜利 90 周年主题）<br>· 官方入口：<a href="https://www.nlc.cn/" target="_blank" rel="noopener">中国国家图书馆官网 nlc.cn</a>（展览页以官网公布为准）。<br><span class="tag warn">逐图核验 · 未授权不上图</span></div>'+
    '<h3 style="font-size:13px;color:#6b140d;margin:14px 0 6px">三、授权口径与四条安全路径</h3>'+
    '<div class="disc"><strong>"公开可访问"≠"可自由使用"。</strong>依《著作权法》第十条，摄影作品自完成即受保护，信息网络传播权归权利人；第二十四条的"个人学习研究欣赏"与"适当引用"不适用于公开发布、整图作配图的场景。"注明出处＋侵权删除"只保住署名权，不免除侵权责任。</div>'+
    '<div class="card-s"><b>四条安全路径</b><br>① <b>公有领域</b>：须有发表年份与作者生卒年证据，按 2021.6.1 前后法律衔接判定，不凭"照片老"推断；<br>② <b>CC 授权</b>：按协议署名并遵守相同方式共享等条件；<br>③ <b>书面授权或正规图库购买</b>；<br>④ <b>存疑即弃用</b>：来源或授权不明者不放入本页，仅提供馆方 / 权威页面链接。</div>'+
    '<div class="small" style="margin:10px 0 6px">未匹配真实影像的节点仍显示程序绘制示意图，<strong>非史料照片、不得作历史图像引用</strong>。</div>'+
    [['meeting','遵义会议','会议场景示意'],['river','飞夺泸定桥','铁索桥战斗场景示意'],['snow','翻越夹金山','雪山行军场景示意'],['grass','穿越松潘草地','草地行军场景示意'],['depart','于都出发','渡河出发场景示意'],['arrive','会宁会师','会师场景示意']].map(t=>'<figure class="note-fig">'+fig(t[0],t[1])+'<figcaption>'+t[1]+' · '+t[2]+' · 程序绘制</figcaption></figure>').join('');
}
function renderSourcePanel(){
  $('#dTitle').textContent='资料来源与核验说明';
  const pend=NODES.filter(n=>n[12]!=='已核').map(n=>'<div>· 节点 '+n[0]+' '+n[4]+'：'+n[12]+'</div>').join('');
  const pMem=MEMORIALS.filter(m=>m[3]!=='已核').map(m=>'<div>· '+m[0]+'：'+m[3]+'</div>').join('');
  $('#dBody').innerHTML='<table class="mini"><thead><tr><th>编号</th><th>层级</th><th>来源</th><th>用途与边界</th></tr></thead><tbody>'+
    SOURCES.map(s=>'<tr><td><strong>'+s[0]+'</strong></td><td>'+s[1]+'</td><td>'+(s[4]==='—'?s[2]:'<a href="'+s[4]+'" target="_blank" rel="noopener">'+s[2]+'</a>')+'</td><td class="small">'+s[3]+'</td></tr>').join('')+'</tbody></table>'+
    '<h3 style="font-size:13px;color:#6b140d;margin:14px 0 5px">公开待核清单</h3><div class="small">按"带标记公开"原则，下列不确定性不隐去，供读者参与纠错。</div><div class="small" style="margin-top:6px">'+pend+pMem+'</div>';
}
function showModal(){
  const m=$('#modal');
  m.innerHTML='<div class="mbox"><button class="mclose" id="mClose">×</button><h2>关于本页 · 口径与授权</h2>'+
    '<h3>一、纪念口径</h3><p>"90周年"指长征<strong>胜利</strong>90周年（1936—2026）。中央红军于1935.10.19到达吴起镇结束其长征；1936.10.9红四方面军到会宁、10.22红二方面军到将台堡，三大主力会师标志长征全面胜利结束。两处日期、地点严格分列，不合并表述。</p>'+
    '<h3>二、地图示意声明</h3><p>路线为<strong>史料节点连线，非精确行军轨迹</strong>；坐标为近似位置，仅供定位示意。底图由腾讯地图提供；本页不绘制自绘行政区划。离线状态下降级为时间轴与文字内容。</p>'+
    '<h3>三、待核公开</h3><p>馆名待核、今属表述待核等不确定性一律带标记公开，不隐去、不抹平，供读者参与纠错。</p>'+
    '<h3>四、图片授权口径</h3><p>长征沿途极少留下照片，现存标志性影像多为 1936 年长征结束后拍摄的亲历者影像，部分为摆拍；本页任何图片都不表述为"行军现场照片"。</p><p>"公开可访问"不等于"可自由使用"。依《著作权法》第十条，摄影作品自完成即受保护；第二十四条的"个人学习研究欣赏"和"适当引用"均不适用于公开发布、整图作配图的场景；"注明来源＋侵权删除"只保住署名权，挡不住信息网络传播权侵权。老照片是否进入公有领域，须按 2021.6.1 前后法律衔接、结合发表年份与作者生卒年逐张判定。</p><p>本页"图片"标签下展示三张<strong>来源可核验的历史影像</strong>（中国军网《光影90》，1932—1936 年，摄者佚名 / 苏静 / 耿飚），<strong>授权状态逐张标注为待核</strong>，商用须另行取得授权；国家图书馆"馆藏长征文献专题展"书影因展览为 2026 年策展产物、展览页面图片≠馆藏原件公版，<strong>逐图核验、未授权不上图</strong>，仅列书目与官方链接。其余节点为程序绘制示意，非史料照片。</p>'+
    '<h3>五、操作</h3><p>拖动底部滑杆或点"展开路线"逐步绘制；点节点看事件，点彩色路线看部队；键盘 ← → 切节点、空格展开/暂停、Esc 关闭面板。地址栏深链接 <code>?year=1935&amp;place=遵义</code> 可直接定位。</p></div>';
  m.classList.remove('hidden');
  $('#mClose').onclick=()=>m.classList.add('hidden');
  m.onclick=e=>{if(e.target===m)m.classList.add('hidden')};
}
function parseDeepLink(){
  const q=new URLSearchParams(location.search);
  if(!q.has('year')&&!q.has('place')&&!q.has('event'))return false;
  const place=q.get('place');
  if(place){const hit=NODES.find(n=>PLACES[n[3]].h===place||PLACES[n[3]].n===place||n[9].indexOf(place)>=0);if(hit){selectNode(hit[0]);toast('已从链接定位到：'+hit[4]);return true}}
  const ev=q.get('event');
  if(ev){const hit=NODES.find(n=>n[9].indexOf(ev)>=0||n[4].indexOf(ev)>=0);if(hit){selectNode(hit[0]);return true}}
  const year=q.get('year');
  if(year){const hit=NODES.find(n=>n[2].indexOf(year)===0);if(hit){selectNode(hit[0]);return true}}
  toast('链接中的地点或年份未匹配到节点，已显示全部');return false;
}

/* ========== 五、事件绑定 ========== */
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-act]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  actFilter=Number(b.dataset.act);currentId=null;currentRoute=null;drawMap();renderRail();
  if(drawerTab==='node')$('#dBody').innerHTML='<div class="empty">已筛选幕次，点击地图节点查看内容。</div>';
}));
document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.layer;layers[k]=!layers[k];b.classList.toggle('on',layers[k]);drawMap();
}));
document.querySelectorAll('.d-tabs button').forEach(b=>b.addEventListener('click',()=>{drawerTab=b.dataset.tab;openDrawer(drawerTab)}));
$('#dClose').addEventListener('click',closeDrawer);
$('#aboutBtn').addEventListener('click',showModal);
$('#playBtn').addEventListener('click',()=>{if(autoTimer)stopReveal();else startReveal()});
$('#zoomIn').addEventListener('click',()=>{if(map)map.zoomTo(Math.min(map.getZoom()+1,18))});
$('#zoomOut').addEventListener('click',()=>{if(map)map.zoomTo(Math.max(map.getZoom()-1,3))});
$('#skipBtn').addEventListener('click',()=>{stopReveal();setReveal(REVEAL_ORDER.length);toast('已展开全部 30 个节点')});
$('#range').addEventListener('input',e=>{stopReveal();setReveal(Number(e.target.value))});
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden')){$('#modal').classList.add('hidden');return}closeDrawer();return}
  const list=REVEAL_ORDER;
  let i=list.indexOf(currentId);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();i=(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;selectNode(list[i]);
  }
  if(e.key===' '){e.preventDefault();if(autoTimer)stopReveal();else startReveal()}
});

/* ========== 六、启动 ========== */
renderRail();renderLegend();initMap();
const hadLink=parseDeepLink();
if(!hadLink)setTimeout(()=>startReveal(),700);
</script>
</body>
</html>
